# Tool configuration only; the scripts are run directly, not installed as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import sorting, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["UP017"]  # timezone.utc reads fine; no need for the datetime.UTC alias
